# Development in a container (see docs/local-setup.md): the repository is
# mounted, the server reloads on changes. The dependencies and builds stay in
# volumes, apart from the host's: their native code is built for the container.
#
#     HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up --build
#
# For the production image, see the Dockerfile and docs/deployment.md.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
      - node_modules:/app/assets/node_modules
    # For IEx: `docker compose attach dev`, Ctrl+P Ctrl+Q to leave it running
    stdin_open: true
    tty: true

volumes:
  deps:
  build:
  node_modules:
