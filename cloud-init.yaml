#cloud-config
# Padocs on a bare machine (see docs/deployment/bare-machine.md): given as the
# user data of a new Debian 13 machine, it installs Podman and Caddy, runs the
# image of the SQLite target from ghcr.io as a systemd service (a Quadlet),
# with the database and the images on the machine's disk, and Caddy in front
# for HTTPS, its certificate from Let's Encrypt.
#
# Before creating the machine, replace docs.example.org, twice below, by the
# domain of Padocs, whose A record points to the machine:
#
#   sed 's/docs\.example\.org/docs.my-domain.org/g' cloud-init.yaml > user-data.yaml
#
# To back up the database to S3 with Litestream, uncomment the lines starting
# with "#L " too, and fill in the bucket and its keys:
#
#   sed -e 's/docs\.example\.org/docs.my-domain.org/g' -e 's/^\( *\)#L /\1/' \
#     cloud-init.yaml > user-data.yaml

package_update: true
package_upgrade: true
packages:
  - podman
  - caddy
  - unattended-upgrades

write_files:
  # Deferred: written once the packages are installed, so that Caddy's own
  # Caddyfile does not replace this one.
  - path: /etc/containers/systemd/padocs.container
    defer: true
    content: |
      [Unit]
      Description=Padocs
      Wants=network-online.target
      After=network-online.target

      [Container]
      Image=ghcr.io/l-vincent-l/padocs:sqlite
      ContainerName=padocs
      PublishPort=127.0.0.1:4000:4000
      Volume=padocs-data.volume:/data
      Secret=padocs_secret_key_base,type=env,target=SECRET_KEY_BASE
      Environment=PHX_HOST=docs.example.org
      Environment=DATABASE_PATH=/data/padocs.db
      # A new image on ghcr.io, pulled by podman-auto-update.timer
      AutoUpdate=registry
      # Time for the documents being edited to save their last edits
      StopTimeout=30

      [Service]
      Restart=always
      # The first start pulls the image
      TimeoutStartSec=900
      TimeoutStopSec=40

      [Install]
      WantedBy=multi-user.target

  # The database and the images, owned by nobody, which Padocs and Litestream
  # run as
  - path: /etc/containers/systemd/padocs-data.volume
    defer: true
    content: |
      [Volume]
      VolumeName=padocs-data
      User=65534
      Group=65534

  - path: /etc/caddy/Caddyfile
    defer: true
    content: |
      docs.example.org {
        reverse_proxy localhost:4000
      }

  # Litestream: the database streamed to S3, restored from it when the disk
  # holds none (a new machine). For AWS S3, without endpoint.
  #L - path: /etc/litestream.yml
  #L   defer: true
  #L   content: |
  #L     dbs:
  #L       - path: /data/padocs.db
  #L         replica:
  #L           url: s3://my-bucket/padocs.db?endpoint=https://s3.example.com&region=auto
  #L - path: /etc/litestream.env
  #L   defer: true
  #L   permissions: "0600"
  #L   content: |
  #L     AWS_ACCESS_KEY_ID=...
  #L     AWS_SECRET_ACCESS_KEY=...
  #L - path: /etc/containers/systemd/litestream.container
  #L   defer: true
  #L   content: |
  #L     [Unit]
  #L     Description=Litestream, the database of Padocs to S3
  #L     # Restored before Padocs starts, stopped after it, for a last sync
  #L     Before=padocs.service
  #L     [Container]
  #L     Image=docker.io/litestream/litestream:0.5.17
  #L     ContainerName=litestream
  #L     Exec=replicate
  #L     User=65534
  #L     Group=65534
  #L     Volume=padocs-data.volume:/data
  #L     Volume=/etc/litestream.yml:/etc/litestream.yml:ro
  #L     EnvironmentFile=/etc/litestream.env
  #L     [Service]
  #L     ExecStartPre=/usr/bin/podman run --rm --user 65534:65534 \
  #L       -v padocs-data:/data -v /etc/litestream.yml:/etc/litestream.yml:ro \
  #L       --env-file /etc/litestream.env docker.io/litestream/litestream:0.5.17 \
  #L       restore -if-db-not-exists -if-replica-exists /data/padocs.db
  #L     Restart=always
  #L     TimeoutStartSec=900
  #L     [Install]
  #L     WantedBy=multi-user.target padocs.service

runcmd:
  # Generated once, kept on the machine: a new one signs everyone out
  - openssl rand -base64 48 | podman secret create padocs_secret_key_base -
  - systemctl daemon-reload
  - systemctl start padocs
  - systemctl enable --now podman-auto-update.timer
  - systemctl reload-or-restart caddy
