name: Tests

# The checks of `mix precommit`, without changing any file, and the build of
# the assets: on every pull request (Dependabot's included) and every push to
# main. A pull request whose checks fail says so before it is merged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run of the previous one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  # The same versions as the Dockerfile
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.0.6"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/package-lock.json

      # deps and _build, the downloaded NIFs included: a new key when mix.lock
      # or a version changes, the previous cache as a start
      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: |
          mix deps.get
          npm ci --prefix assets

      - name: Compile, warnings as errors
        # --force: the cached _build may hold warnings of an incremental
        # compile (see the precommit alias in mix.exs); the project only,
        # not the deps
        run: mix compile --force --warnings-as-errors

      - name: No unused dependency in mix.lock
        run: mix deps.unlock --check-unused

      - name: Formatted
        run: mix format --check-formatted

      # A message added or changed must be extracted and translated
      - name: Messages extracted
        run: mix gettext.extract --check-up-to-date

      - name: Tests
        run: mix test

      - name: JavaScript tests
        run: npm test --prefix assets

      - name: Assets build
        run: |
          mix assets.setup
          mix assets.build
