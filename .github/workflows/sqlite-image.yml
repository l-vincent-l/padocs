name: SQLite image

# Builds the default image (the `final` target: a SQLite file at
# DATABASE_PATH) and pushes it to ghcr.io, tagged `sqlite` and
# `sqlite-<commit>`, for the hosts that pull an image instead of building it
# (Coolify, see docs/deployment/coolify.md). The `latest` tag is the image of
# Bunny, with libSQL (bunny-image.yml).
#
# Run on every push to main (a merged pull request), or by hand: Actions >
# SQLite image > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time, in order: `sqlite` ends up on the last commit.
concurrency:
  group: sqlite-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sqlite-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sqlite
          # Apart from the cache of the Bunny image, built with other arguments
          cache-from: type=gha,scope=sqlite-image
          cache-to: type=gha,scope=sqlite-image,mode=max
